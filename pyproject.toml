[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "garmin-connect-mcp"
version = "0.1.0"
description = "MCP server exposing your own Garmin Connect activity, health, and training data to Claude"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Limão" }]
dependencies = [
    "mcp>=2.0.0,<3.0.0",
    "garmin-connect-personal-api-python>=1.0.0",
    "garminconnect>=0.2.20",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.scripts]
garmin-mcp-server = "garmin_mcp.server:main"
garmin-mcp-save-key = "garmin_mcp.authenticate_official:main"
garmin-mcp-auth = "garmin_mcp.authenticate_unofficial:main"

[tool.hatch.build.targets.wheel]
packages = ["src/garmin_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
